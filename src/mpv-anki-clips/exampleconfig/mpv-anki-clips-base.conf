###
### Base/profile-specific settings for MPV Anki Clips.
### Save this file to mpv's script-opts/mpv-anki-clips-base.conf.
### The active custom profile is loaded on top of these settings.
### Core settings are in mpv-anki-clips-core.conf and cannot be overridden by profiles.
###

##
## General settings
##

# Remove regular whitespace from subtitle text when it contains non-Latin characters.
# Latin-only text is unchanged; mixed Latin/non-Latin text loses its regular whitespace.
# Full-width ideographic spaces (　) are not removed.
# I recommend turning this setting OFF.
nuke_spaces=no
# Remove arrow characters (➡, →) from subtitle text.
# - "yes": Remove arrows completely.
# - "no": Preserve arrows.
# - "join_arrow": Preserve original line breaks, join consecutive subtitle entries with a full-width space when an arrow is present for Anki export, keep arrows.
# - "join": Same as join_arrow but remove arrows in Anki export.
remove_arrows=join
# Preserve newlines in Anki note fields (converted to <br> tags).
# Set to "yes" to keep newlines, "no" to replace them with spaces.
preserve_newlines_in_anki=yes
# Preserve text within Japanese parentheses (e.g., （クラクション）) in Anki note fields.
# Set to "yes" to keep parenthetical text, "no" to remove it.
preserve_japanese_parentheses=yes

##
## Anki settings
##

# HTML template for embedding video clips in Anki.
video_template=<video controls="" src="%s" class="clip-tv-general"></video>

##
## Subtitle settings
##

# Maximum number of embedded subtitle tracks to copy over. External subtitles are added extra.
subtitle_track_count=2
# Include embedded subtitles in the output clip (mapped as soft tracks where possible).
# This is the subtitle-stream toggle.
include_subtitles=yes
# Include external subtitles in the video clip (requires file existence).
include_external_subtitles=yes
# Language tag used when an external subtitle has no language metadata or
# trailing filename code (for example, movie.jpn.srt or movie_en.ass).
# Use any FFmpeg language code such as jpn. The default is und (undetermined).
external_subtitle_unknown_language=und
# Include metadata (title, chapters, etc.) in encoded video clips.
include_metadata=yes

##
## Miscellaneous info
##

# Format for miscinfo. Stand-ins:
#   %n     - cleaned filename (for tags): no extension, common resolution removed, optional episode trimming
#   %fn    - exact filename from mpv (usually includes extension)
#   %path  - full mpv path/URL of the current file
#   %dir   - directory portion of %path (empty if unavailable)
#   %title - mpv media title (often the filename without extension)
#   %t     - current playback timestamp (e.g., 37m21s122ms)
#   %tms   - current playback timestamp without milliseconds (e.g., 37m21s)
#   %st    - clip/subtitle start timestamp (e.g., 37m21s122ms)
#   %stms  - clip/subtitle start timestamp without milliseconds (e.g., 37m21s)
#   %et    - clip/subtitle end timestamp (e.g., 37m21s122ms)
#   %etms  - clip/subtitle end timestamp without milliseconds (e.g., 37m21s)
#   %d     - detected episode number (may be empty)
#   %e     - value of env var MPV_ANKI_CLIPS_TAGS (may be empty)
#   %l     - loudnorm settings (or "none" if loudnorm is disabled)
#   %mib   - last encoded clip output size (e.g., 2.34 MiB; "unknown" if unavailable)
#   %cl    - last encoded clip output length (e.g., 0:12.345; "unknown" if unavailable)
#   %clms  - last encoded clip output length without milliseconds (e.g., 0:12; "unknown" if unavailable)
# example: miscinfo_format=%n | %st-%et | size: %mib | length: %cl | loudnorm: %l
miscinfo_format=Source: %title | (%stms-%etms, length: %clms) | (loudnorm: %l) | (size: %mib)

##
## Video clip settings
##

# Enable the encoded video stream.
# Set to "no" together with enable_audio=yes for audio-only clips.
# Subtitle-only output is not supported when both enable_video and enable_audio are disabled.
enable_video=yes
# Enable the encoded audio stream.
# Set to "no" together with enable_video=yes for video-only clips.
# Subtitle-only output is not supported when both enable_video and enable_audio are disabled.
enable_audio=yes

##
## Video encoding settings
##

# Container for video clips: mkv, mp4, or webm
# MKV supports soft subtitles; WebM is optimized for web playback
video_container=mkv
# Video codec selection
# Available codecs with container support:
# - libx264: H.264, widely compatible (mkv, mp4)
# - libx265: H.265/HEVC, better quality but slower (mkv, mp4)
# - libvpx: VP8, fast encoding (mkv, webm)
# - libvpx-vp9: VP9, efficient modern codec (mkv, webm)
# - libsvtav1: AV1 via SVT, fast AV1 encoder (mkv, webm, mp4)
# - librav1e: AV1 via Rust, good quality (mkv, webm, mp4)
# - libaom-av1: AV1 reference, highest quality (mkv, webm, mp4)
# - av1_nvenc: AV1 via NVIDIA GPU (mkv, mp4)
# - av1_amf: AV1 via AMD GPU (mkv, mp4)
# - av1_qsv: AV1 via Intel GPU (mkv, mp4)
video_codec=libsvtav1
# Video quality management policy
# Choices:
#   enabled                      - default; pass either -crf or -b:v according to video_use_crf
#   allow_combined_crf_bitrate   - when video_use_crf=yes, pass both -crf and -b:v
#   disabled                     - do not pass -crf or -b:v (you may still use video_custom_args)
video_quality_management=enabled
# Enable/disable built-in video filtering
# - enabled  : apply scaling and FPS filters according to video_width/video_height/video_fps
# - disabled : ignore width/height/FPS and do NOT pass -vf/--vf-add filters (use source resolution/FPS)
video_filter=enabled
# Video bitrate (fallback when not using CRF)
video_bitrate=500k
# Enable CRF-based encoding (recommended for best quality)
# - When yes: uses video_crf value for quality control (single-pass)
# - When no: uses video_bitrate for size control (can use two-pass)
# Note: CRF and two-pass are mutually exclusive; when both are enabled, two-pass wins and CRF is ignored.
video_use_crf=yes
# Constant Rate Factor (CRF) provides better quality control than fixed bitrate
# - Range: 0-51 (lower = higher quality, but larger file size)
# - Recommended ranges:
#   * H.264/H.265: 18-23 for 720p, 20-28 for 1080p
#   * VP9: 30-35 for 720p, 32-37 for 1080p
#   * AV1: 25-35 for 720p, 27-37 for 1080p
video_crf=53
# Two-pass video encoding for more consistent bitrate at a target size
# - Only applies when video_use_crf=no
# - Pass stats are written to your OS temp directory automatically
video_two_pass=no
# Video width in pixels. -2 preserves aspect ratio based on height.
video_width=-2
# Video height in pixels. -2 preserves aspect ratio based on width. Use this to adjust video size.
video_height=640
# Frames per second for video clips (1-60). Set to 0 to keep source FPS.
# Tip: Prefer keeping source FPS for CRF-based encodes unless you know you need a specific FPS.
video_fps=0
# Encoding preset/speed (codec-specific)
# - H.264 (libx264): ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow (slower = better quality/size)
# - H.265/HEVC (libx265): ultrafast .. placebo (placebo extremely slow; typical: medium/slow)
# - VP8/VP9 (libvpx/libvpx-vp9): use -cpu-used (mpv uses --ovcopts-add, FFmpeg often uses -speed or -row-mt etc.)
# - AV1 (libsvtav1): -preset 0..13 (0 slowest/best, 13 fastest); common: 3..8
# - AV1 (librav1e): -speed 0..10 (0 slowest/best); typical: 3..7
# - AV1 (libaom-av1): -cpu-used 0..8 (0 slowest/best); typical: 3..6
# - AV1 (av1_nvenc): -preset p1..p8 (p1 fastest, p8 slowest); typical: p3..p6
# - AV1 (av1_amf): -quality quality|balanced|speed
# - AV1 (av1_qsv): -preset 1..7 (1 fastest, 7 slowest)
video_preset=3
# Additional custom FFmpeg video arguments (advanced)
# - Enter raw FFmpeg flags here; they are appended after other options (so they can override defaults)
# - The parser supports quotes and key=value tokens. If a value contains colons or spaces, prefer the equals form
#   - libsvtav1 examples
# General High-Efficiency:			-svtav1-params "tune=0:enable-qm=1:qm-min=0:qm-max=8:film-grain=0:fast-decode=0:keyint=240"
# Anime/Cartoon Optimized:			-svtav1-params "tune=0:enable-overlays=1:scd=1:scm=0:aq-mode=2:lookahead=24:tile-columns=1"
# Grainy/High-Motion:				-svtav1-params "tune=0:film-grain=10:enable-tpl-la=1:superres-mode=1:overshoot-pct=50"
#   - x264 lookahead and refs:
#													-rc-lookahead 32 -refs 4
# examples of custom arg formats:
# video_custom_args=-x265-params "--interlace=0:--total-frames=0:--level-idc=0:--high-tier=1:--uhd-bd=0:--ref=4:--bitrate=4000:--overscan=0"
# video_custom_args=-x265-params interlace=0:total-frames=0:level-idc=0:high-tier=1:uhd-bd=0:ref=4:bitrate=4000:overscan=0
# video_custom_args=-vf "fps=24/1.001,scale='min(-2,iw)':'min(720,ih)':flags='lanczos+accurate_rnd'" -x265-params "--bitrate=1200:--interlace=0:--high-tier=1:--uhd-bd=0"
# video_custom_args=-crf 48 -vf "fps=60,scale='min(-2,iw)':'min(640,ih)':flags='lanczos+accurate_rnd'" -svtav1-params "tune=0:enable-tpl-la=1:aq-mode=2:enable-qm=1:qm-min=0:qm-max=4:film-grain=0:fast-decode=0:overshoot-pct=50:keyint=240"
video_custom_args=
# Padding in seconds added to video clip timings (e.g., 0.22 = 220ms).
# Only applied to subtitle-based timings, not manually set timings.
video_padding=0.220
# Audio codec selection
# - libopus: High quality at low bitrates, best for WebM/MKV
# - aac: Widely compatible, good quality, standard for MP4
# - libmp3lame: Maximum compatibility but lower quality
# - libfdk_aac: High-quality AAC implementation
audio_codec=libopus
# Maximum number of internal audio streams to include in the encoded output.
# - 1 = default behavior (single best matching stream)
# - >1 = include additional streams in priority order
# - External audio tracks are not considered.
audio_track_count=1
# Language priority for audio streams (comma-separated).
# Streams are sorted by this list, then by original stream order.
# Matching supports exact tags and common aliases/regions (e.g., eng/en, jpn/ja, en-US -> en).
# Example: audio_lang_priority=jpn,ja,eng,en,und
audio_lang_priority=jp,jpn,ja,ger,de,eng,en,und
# Audio quality management policy
# Choices:
#   enabled                        - default; for libopus, pass -vbr on when audio_use_vbr=yes; otherwise pass -b:a
#   allow_combined_vbr_bitrate     - pass both -vbr on (libopus) and -b:a
#   disabled                       - do not pass -vbr or -b:a (you may still use audio_custom_args)
audio_quality_management=allow_combined_vbr_bitrate
# Audio bitrate (used when not using VBR, or alongside VBR when allowed)
audio_bitrate=64k
# Use Variable Bitrate (VBR) for audio
# - yes: Better quality per file size (recommended, especially for libopus)
# - no: Use constant bitrate only
audio_use_vbr=yes
# Additional custom FFmpeg audio arguments (space-separated, advanced users only)
# - Must be valid FFmpeg arguments
# - Will be added after other options, allowing overrides
# - Example: "-af volume=2,lowpass=3000"
audio_custom_args=
# Duration of audio fade-in in seconds (e.g., 1.0 = 1 second, 0 = no fade).
audio_fade_in=0.250
# Duration of audio fade-out in seconds (e.g., 1.0 = 1 second, 0 = no fade).
audio_fade_out=0.100
# Enable loudnorm audio normalization (yes/no, default: no)
loudnorm_enabled=yes
# Use two-pass loudnorm for more accurate normalization
loudnorm_two_pass=yes
# Loudnorm target integrated loudness in LUFS (default: -23)
loudnorm_I=-26
# Loudnorm target loudness range in LU (default: 7)
loudnorm_LRA=11
# Loudnorm target true peak in dBTP (default: -1.5)
loudnorm_TP=-1.5
# Enable linear loudnorm normalization (yes/no, default: yes; ignored in two-pass mode)
loudnorm_linear=yes
