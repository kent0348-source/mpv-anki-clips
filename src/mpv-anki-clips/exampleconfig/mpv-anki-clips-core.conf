###
### Core MPV Anki Clips settings.
### Save this file to mpv's script-opts/mpv-anki-clips-core.conf.
### These options are shared by the base profile and all custom profiles.
### Core values override any same-named values left in a profile file.
###

##
## General settings
##

# Processing mode for text sent to clipboard/autoclip targets.
# "single_line" keeps the historical behavior: trim, apply arrow handling, and collapse line breaks to spaces.
# "subtitle_content" copies subtitle text as-is, preserving arrows, spaces, and line breaks.
# "custom_pattern" applies copy_text_custom_pattern/copy_text_custom_replacement first, then formats the result using copy_text_custom_base_mode.
# Applies to Ctrl+c / Ctrl+C, clipboard autocopy, GoldenDict, and custom_command text arguments.
copy_text_mode=subtitle_content
# Pattern/replacement used when copy_text_mode=custom_pattern.
# Uses Lua's string.gsub pattern syntax rather than PCRE.
# Example for stripping a speaker label at the start of each subtitle line:
# copy_text_custom_pattern=^[^:]+:%s*
# copy_text_custom_replacement=
copy_text_custom_pattern=^[^:]+:%s*
copy_text_custom_replacement=
# How copy_text_custom_pattern is applied.
# "all" runs one replacement across the full subtitle text.
# "per_line" applies the replacement to each subtitle line separately before final formatting.
copy_text_custom_scope=all
# Final formatting used after copy_text_custom_pattern runs.
# "single_line" trims and collapses line breaks like the historical copy mode.
# "subtitle_content" preserves line breaks and spacing after filtering.
copy_text_custom_base_mode=subtitle_content
# Use text from clipboard as fallback for subtitles when none were captured.
use_clipboard_when_empty=no
# Write unique completed clip-job records to disk.
# Set to "yes" to enable structured JSON logging.
clip_log_enabled=no
# Directory where clip-job records are written.
# When empty, MPV Anki Clips defaults to a "clip_logs" directory next to the script.
clip_log_save_dir=W:\mpv\mpv-anki-clips_logs\
# Capture deeper encode-process metadata for each clip log record.
# "no" keeps logging lightweight and records only the final encode command plus effective loudnorm result.
# "yes" also records extra encode-process details such as the loudnorm measurement command and full analyzed loudnorm stats.
clip_log_advanced_encode_logging=yes
# Two clips from the same source are considered duplicates if either one overlaps
# this percentage or more of its own duration with the other clip.
clip_log_duplicate_overlap_percent=90
# Serialize clip encoding across MPV Anki Clips machines through the Docker LAN
# coordinator in lan_queue_server/. All clients must use the same host/port.
# When enabled, queue failures cancel the export instead of starting FFmpeg
# without a grant.
queue_server_enabled=no
# Private LAN IP or hostname of the Docker host. Do not include http:// or a path.
queue_server_host=192.168.1.50
queue_server_port=18789
# Curl transport timeouts in seconds.
queue_server_connect_timeout=2
queue_server_request_timeout=5
# Must be comfortably shorter than QUEUE_LEASE_SECONDS on the server.
# The supplied Docker template uses a 30-second lease.
queue_server_heartbeat_interval=10
# Debug logging level for console messages (OSD unaffected)
# Choices:
#   low      - only uncategorized existing logs (suppress debug categories)
#   basic    - FFmpeg encode output
#   advanced - FFmpeg encode output + file integrity checks
#   full     - all categories (codec compatibility, profile/field loading, file integrity, detailed loudnorm) + FFmpeg encode output
debug_level=basic
# Maximum number of selected notes that can be overwritten in Anki.
# Prevents accidental mass overwrites.
card_overwrite_safeguard=1
# Automatically copy subtitles to clipboard as they appear on screen.
# Can be toggled via the OSD menu (key: t).
autoclip=no
# Method for autoclip:
# "clipboard" - copy to system clipboard (requires xclip/wl-copy).
# "goldendict" - send to GoldenDict.
# "custom_command" - use autoclip_custom_args.
autoclip_method=clipboard
# Command to run when autoclip_method=custom_command.
# Substitutions: %MPV_PRIMARY% (primary sub), %MPV_SECONDARY% (secondary sub).
autoclip_custom_args=

##
## Anki settings
##

# Automatically create the specified deck in Anki.
create_deck=no
# Anki deck name for new cards. Subdecks are supported (e.g., Bank::mpv-anki-clips).
deck_name=jp_words::standard
# Anki note type (model) name. See Tools -> Manage Note Types in Anki.
model_name=Yomi-custom
# Export field set #1 (default)
sentence_field_1=sentence-1
secondary_field_1=secondary-1
video_field_1=video-1
miscinfo_field_1=notes-1
# Export field set #2 (optional)
sentence_field_2=sentence-2
secondary_field_2=secondary-2
video_field_2=video-2
miscinfo_field_2=notes-2
# Export field set #3 (optional)
sentence_field_3=sentence-3
secondary_field_3=secondary-3
video_field_3=video-3
miscinfo_field_3=notes-3
# Tag(s) added to new notes. Uses the same stand-ins as miscinfo_format.
note_tag=mpv-anki-clips
# After a successful note update/export, make the Anki Browser jump to and highlight the target note(s).
# Set to "no" to keep the current Browser selection unchanged after export/update.
highlight_exported_notes_in_browser=no

##
## Subtitle settings
##

# Language priority for subtitle tracks (comma-separated).
subtitle_lang_priority=jp,jpn,ja,eng,ger,de
# Automatically load a secondary subtitle track when a file is opened.
secondary_sub_auto_load=yes
# Language priority for secondary subtitles (comma-separated).
# Use your native language or a known language (e.g., eng, en, ger, de).
secondary_sub_lang=eng,en,ger,de
# Proportion of the top window area where secondary subs are visible when hovered (0.0 to 1.0).
secondary_sub_area=0.05
# Visibility of secondary subtitles:
# "auto" - depends on secondary_sub_area.
# "always" - always visible.
# "never" - never visible.
secondary_sub_visibility=auto

##
## Miscellaneous info
##

# Include additional context info in notes.
miscinfo_enable=yes
# Format for optional queue details shown in the OSD export queue when toggled with Shift+T.
# The line is intended for pre-encode job metadata, so it reuses the miscinfo stand-ins above and also adds:
#   %p       - active encoding profile name
#   %precl   - approximate queued clip length with milliseconds, derived from start/end (e.g., 0:12.345)
#   %preclms - approximate queued clip length without milliseconds (e.g., 0:12)
# Notes:
# - %mib, %cl, and %clms are post-encode values; during queued/running preview they may still show "unknown"
# - %precl and %preclms are intended for queue preview because they work before the clip finishes encoding
# example: queue_details_format=%fn | (%p) | (%stms-%etms, length: %preclms) | (loudnorm: %l)
queue_details_format=%fn | (%p) | (%stms-%etms, length: %preclms) | (loudnorm: %l)
# Scale factor for subtitle preview text font size relative to menu_font_size (0.5 to 2.0).
subtitle_preview_font_scale=0.7
# Global character limit for capped menu previews.
# Applies to capped previews such as:
# - Anki target note field previews (sentence/secondary/video/miscinfo)
# - Browser note preview
# - Video custom args preview (only when cap_video_custom_args_preview=yes)
# Example values: 7, 36, 40, 85
preview_text_char_limit=25
# Character limit for each line in the right-hand captured primary subtitle preview.
# Separate from preview_text_char_limit so long captured lines can be shortened without affecting menu field previews.
captured_primarysub_preview_char_limit=55
# Character limit for each line in the right-hand captured secondary subtitle preview.
# Useful when translation/secondary subtitles tend to be longer or visually noisier than the primary line.
captured_secondarysub_preview_char_limit=40
# Cap the "Video custom args" preview using preview_text_char_limit.
# Set to "yes" to cap, "no" to show full value.
cap_video_custom_args_preview=yes

##
## Video clip settings
##

# Action after a clip job finishes:
# "no"     - do nothing.
# "yes"    - preview the created clip in mpv.
# "notify" - play a soft notification sound instead of opening the clip.
# "toast"  - Windows toast with title/body/sound (requires PowerShell BurntToast; falls back to sound-only if unavailable).
preview_video=toast

##
## Test encode settings
##

# Output folder for test encodes when pressing the 'o' key.
# Leave empty to default to your Videos user folder on Windows, or ~/Videos on Linux/macOS.
test_encode_output_dir=C:\Users\John\Videos\test_encodes

##
## Local FFmpeg executable (optional)
##

# Leave empty to keep current automatic lookup (common directories, then mpv's PATH).
# Set an executable name or full path to select a specific local build.
# Linux example: /home/username/ffmpeg_build/bin/ffmpeg
# Windows example: C:/ffmpeg/bin/ffmpeg.exe
# Used for local codec checks and encoding; this does not affect remote FFmpeg.
ffmpeg_exec=

##
## Remote FFmpeg over SSH (optional, advanced)
##

# Run FFmpeg on a more powerful remote machine via SSH.
# The remote machine encodes the clip and writes it to a shared staging directory,
# then MPV Anki Clips copies it back to your local output directory (e.g., Anki media folder).
# Requirements:
# - SSH server running on the remote machine with key-based authentication (non-interactive)
# - ffmpeg installed and available in PATH on the remote machine
# - A shared network folder accessible by both machines at the same path (e.g., F:\...)
remote_ffmpeg_enabled=no
# Remote SSH host (hostname or IP address, e.g., JOHN-PC or 192.168.1.10)
remote_ssh_host=192.168.1.50
# SSH username (optional; leave empty if your SSH config handles it or if using current username)
remote_ssh_user=john
# SSH port (default: 22)
remote_ssh_port=22
# Path to SSH private key file (optional; leave empty to use default SSH key)
remote_ssh_identity_file=C:\Users\John\.ssh\id_ed25519
# Additional SSH arguments (optional, advanced)
# Example: -o StrictHostKeyChecking=no -o ConnectTimeout=10
remote_ssh_extra_args=
# Remote FFmpeg executable name or path (default: ffmpeg)
# Change this if ffmpeg is not in PATH on the remote machine
remote_ffmpeg_exec=ffmpeg
# Shared staging directory:
# - *_local: path as seen from THIS machine (laptop), used for copying the staged clip back locally
# - *_remote: path as seen from the REMOTE machine (host), used as FFmpeg output path
# If *_remote is empty, MPV Anki Clips assumes both machines see the same path.
#
# Examples:
# - Laptop sees the share as UNC, host sees it as a local disk:
#     remote_encode_staging_dir_local=\\JOHN-PC\Storage\_mpv-anki-clips_staging
#     remote_encode_staging_dir_remote=D:\Storage\_mpv-anki-clips_staging
# - Both machines see the same mapped drive letter:
#     remote_encode_staging_dir_local=F:\Storage\_mpv-anki-clips_staging
#     remote_encode_staging_dir_remote=F:\Storage\_mpv-anki-clips_staging
remote_encode_staging_dir_local=K:\_mpv-anki-clips_staging\
remote_encode_staging_dir_remote=F:\John Data F\_mpv-anki-clips_staging\
# Optional path remapping rules for FFmpeg args (when input paths differ between machines)
# Format: localPrefix=>remotePrefix;localPrefix2=>remotePrefix2
# Example:
#   \\JOHN-PC\Storage\=>D:\Storage\;F:\=>D:\Storage\
remote_path_map=\\JOHN-PC\John Data F\=>F:\John Data F\;K:\=>F:\John Data F\;L:\=>E:\John Data\
# Clean up staged files after copying locally (yes/no, default: yes)
# When yes, deletes the staged clip and argument files from the configured staging directory after a successful copy.
# When no, keeps staged files for debugging (you must clean them up manually).
remote_encode_cleanup=yes

##
## Forvo support (optional)
##

# Fetch audio from Forvo:
# "yes" - fetch if vocab audio is missing.
# "always" - always fetch and replace existing audio.
# "no" - disable Forvo.
use_forvo=no
# Field for vocabulary (matches Rikaitan’s {expression}).
vocab_field=expression
# Field for vocabulary audio (matches Rikaitan’s {audio}).
vocab_audio_field=audio

##
## Menu settings
##

# Font size for the OSD menu (e.g., 22; script may reduce further for compactness).
menu_font_size=26
# Font name for the OSD menu.
menu_font_name=Noto Sans CJK JP
# Show selected subtitle text in the OSD menu.
show_selected_text=yes

##
## Global shortcut settings
##

# Key to open the MPV Anki Clips menu. This is a normal, non-forced mpv binding.
# Leave empty to disable; mpv's input.conf may optionally bind the script action instead.
menu_key_open=a

# These keys stay active during playback, including while an add-on menu is open.
# Leave a value empty to disable that default key; the named action remains available
# for custom input.conf bindings.
global_key_copy_primary=Ctrl+c
global_key_copy_secondary=Ctrl+C
global_key_secondary_visibility=Ctrl+v
global_key_secondary_previous=Ctrl+k
global_key_secondary_next=Ctrl+j
global_key_quick_line_menu=ctrl+g
global_key_quick_card_menu=Alt+g
global_key_sub_rewind=Ctrl+h
global_key_sub_replay=Ctrl+H
global_key_sub_play_to_next=Ctrl+L
global_key_restart_mpv_current_file=Ctrl+Y

##
## Advanced-menu shortcut settings
##

