##
## AnkiConnect settings
##

# AnkiConnect server address (default: local machine).
ankiconnect_url=127.0.0.1:8765

##
## Video encoding settings
##

# Trim external subtitle files to the clip range before encoding.
# When enabled, MPV Anki Clips creates a temporary SRT, WebVTT, ASS, or SSA copy
# containing only cues that overlap the encode range. Cues crossing either
# range boundary are kept. Embedded subtitle streams are not changed.
# The temporary copy is deleted after the encode attempt finishes.
fix_subtitle_duration=yes
