<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title description">
  <title id="title">How MPV Anki Clips binding scope affects key precedence</title>
  <desc id="description">Menu-only shortcuts are temporary forced bindings active only while the advanced menu is open. Moving one to global scope makes it a regular script binding that loses to a matching input.conf binding, even while the menu is open. Other global add-on shortcuts are regular bindings too.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #475569; }
      .heading { font-size: 20px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #475569; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .forced { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .regular { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .user { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .result { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .divider { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="1120" height="760" fill="#ffffff"/>
  <text x="48" y="52" class="title">Why menu shortcuts can feel reliable — until scope changes</text>
  <text x="48" y="82" class="subtitle">Example: input.conf contains “s frame-back-step”; the add-on's Set start key is s.</text>

  <rect x="40" y="112" width="510" height="486" rx="14" class="panel"/>
  <text x="64" y="150" class="heading">A. Advanced-menu only (default)</text>
  <text x="64" y="176" class="small">The add-on creates a temporary forced binding on menu open.</text>

  <text x="64" y="218" class="label">MENU CLOSED</text>
  <rect x="64" y="232" width="208" height="68" rx="9" class="user"/>
  <text x="82" y="260" class="label">input.conf: s</text>
  <text x="82" y="282" class="body">frame-back-step</text>
  <path d="M282 266 H330" class="arrow"/>
  <rect x="342" y="232" width="184" height="68" rx="9" class="result"/>
  <text x="366" y="260" class="label">s goes back</text>
  <text x="366" y="282" class="body">one frame</text>

  <text x="64" y="340" class="label">MENU OPEN</text>
  <rect x="64" y="354" width="208" height="78" rx="9" class="user"/>
  <text x="82" y="382" class="label">input.conf: s</text>
  <text x="82" y="405" class="body">frame-back-step</text>
  <path d="M282 392 H330" class="arrow"/>
  <rect x="342" y="346" width="184" height="94" rx="9" class="forced"/>
  <text x="359" y="374" class="label">Temporary forced</text>
  <text x="359" y="397" class="body">Set start wins</text>
  <text x="359" y="419" class="small">until the menu closes</text>

  <line x1="64" y1="466" x2="526" y2="466" class="divider"/>
  <text x="64" y="496" class="body">The menu temporarily takes precedence.</text>
  <text x="64" y="521" class="body">Closing it removes that forced key binding.</text>
  <text x="64" y="559" class="small">Other advanced-menu-only shortcuts behave the same way.</text>

  <rect x="570" y="112" width="510" height="486" rx="14" class="panel"/>
  <text x="594" y="150" class="heading">B. Set start moved to Global</text>
  <text x="594" y="176" class="small">The add-on registers a regular binding continuously.</text>

  <text x="594" y="218" class="label">MENU CLOSED OR OPEN</text>
  <rect x="594" y="232" width="206" height="78" rx="9" class="user"/>
  <text x="612" y="260" class="label">input.conf: s</text>
  <text x="612" y="283" class="body">frame-back-step</text>
  <path d="M810 271 H846" class="arrow"/>
  <rect x="858" y="232" width="196" height="78" rx="9" class="result"/>
  <text x="878" y="260" class="label">input.conf wins</text>
  <text x="878" y="283" class="body">s goes back a frame</text>

  <rect x="594" y="342" width="206" height="78" rx="9" class="regular"/>
  <text x="612" y="370" class="label">Global add-on: s</text>
  <text x="612" y="393" class="body">regular Set start</text>
  <path d="M810 381 H846" class="arrow"/>
  <text x="864" y="359" class="small">lower precedence</text>
  <text x="864" y="382" class="small">than user input.conf</text>
  <text x="864" y="405" class="small">in either menu state</text>

  <line x1="594" y1="466" x2="1056" y2="466" class="divider"/>
  <text x="594" y="496" class="body">Opening the menu does not promote this binding.</text>
  <text x="594" y="521" class="body">The matching input.conf key still takes precedence.</text>
  <text x="594" y="559" class="small">Other global add-on shortcuts are regular bindings too.</text>

  <rect x="40" y="620" width="1040" height="104" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="64" y="655" class="heading">The scope change changes both availability and precedence</text>
  <text x="64" y="683" class="body">Menu-only: forced while open; absent as a physical shortcut while closed.</text>
  <text x="64" y="707" class="body">Global: regular at all times; a same-key input.conf binding wins, even inside the menu.</text>
</svg>
